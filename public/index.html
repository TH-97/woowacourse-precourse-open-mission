<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WoW Item Recommender</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="overlay"></div>

    <main class="container">
      <div class="card">
        <!-- Header -->
        <div class="card-header">
          <h1 class="title">WOW 아이템 추천 시스템</h1>
          <p class="subtitle">던전, 직업, 전문화 별 아이템 추천</p>
        </div>

        <!-- Form -->
        <form
          action="/api/getRecommedItem"
          method="GET"
          id="recommendForm"
          class="card-form"
        >
          <div class="select-grid">
            <div class="select-group">
              <label for="dungeon-select">던전</label>
              <select id="dungeon-select" name="dungeon">
                <option value="">던전을 선택하세요...</option>
              </select>
            </div>

            <div class="select-group">
              <label for="class-select">직업</label>
              <select id="class-select" name="class">
                <option value="">직업을 선택하세요</option>
              </select>
            </div>

            <div class="select-group">
              <label for="spec-select">전문화</label>
              <select id="spec-select" name="spec">
                <option value="">전문화를 선택하세요</option>
              </select>
            </div>
          </div>

          <div class="button-container">
            <button type="submit">아이템 찾기</button>
          </div>
        </form>

        <!-- Results -->
        <div id="results" class="results"></div>

        <!-- Footer -->
        <div class="card-footer">
          <span>v.1.0.0</span>
          <span>Lok'tar Ogar!</span>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
